# Gateway Server (crates/gateway-server) — the Rust-native replacement for deploy/ai-gateway's
# ffc/llm-gateway image (doc/0188/0189). Same real multi-provider fan-out, same env var names (so
# deploy/ai-gateway's ./gen-secrets.sh output is directly reusable), different config *shape*:
# gateway-server is a general-purpose Kong-parity gateway, so the LLM plan is one `llm:` section
# alongside ordinary `services:`/`routes:`, not the whole file.
#
# Credentials are `{vault://env/VAR}` references — resolved by gateway-server's own vault manager
# (the same `env` backend Kong's `{vault://env/...}` syntax uses), never stored here as literals.

llm:
  # How an alias with more than one target picks where to start — every target is still tried on
  # a retryable error regardless (doc/0188 §5.3). `claude` below is registered under both
  # anthropic and bedrock, so it is the pool this applies to.
  load_balance: round-robin
  providers:
    # ── OpenAI (native, Bearer) ────────────────────────────────────────────
    # Full alias set merged from deploy/ai-gateway/gateway.config.yml (its only active lines —
    # its commented-out alternates are not carried over). Capability-tagged aliases
    # (audio/speech, batches, realtime, image) are declared for parity but have no HTTP route
    # yet — no `llm_surface` maps to those capabilities in this config's `services:` section
    # below, so they resolve but are currently unreachable (doc/0189 §1.2's "not built" list).
    - kind: openai
      name: openai
      credential_ref: "{vault://env/OPENAI_API_KEY}"
      models:
        - alias: codex
          wire_id: gpt-5.3-codex
        - alias: embed
          wire_id: text-embedding-3-small
          capability: embeddings
        - alias: tts
          wire_id: gpt-4o-mini-tts
          capability: audio/speech
        - alias: batch
          wire_id: gpt-4o-mini
          capability: batches
        - alias: voice
          wire_id: gpt-realtime
          capability: realtime
        - alias: image
          wire_id: gpt-image-1
          capability: image
        - alias: moderate
          wire_id: omni-moderation-latest
          capability: moderation
        # max_output_tokens clamps a client-requested max_tokens on cross-adapter transcodes.
        - alias: fast
          wire_id: gpt-4o-mini
          max_output_tokens: 16384
        # Pass-through aliases (alias == wire id) so an OpenAI-native client (e.g. Codex, which
        # defaults to wire_api="responses") can send the real model name and reach OpenAI
        # unchanged. `openai.gpt-5.6-sol` is distinct from the `codex` alias below
        # (bedrock-mantle), which Codex only reaches by explicit alias, not this id.
        - alias: gpt-4o-mini
          wire_id: gpt-4o-mini
          max_output_tokens: 16384
        - alias: gpt-4o
          wire_id: gpt-4o
          max_output_tokens: 16384
        - alias: gpt-5-mini
          wire_id: gpt-5-mini
        - alias: gpt-5
          wire_id: gpt-5
        - alias: gpt-5.1
          wire_id: gpt-5.1
        - alias: gpt-5.1-codex
          wire_id: gpt-5.1-codex
        - alias: gpt-5.1-codex-mini
          wire_id: gpt-5.1-codex-mini
        - alias: openai.gpt-5.6-sol
          wire_id: gpt-5.6-sol

    # ── Anthropic (native, x-api-key) — PRIMARY for the "claude" alias ─────
    - kind: anthropic
      name: anthropic
      credential_ref: "{vault://env/ANTHROPIC_API_KEY}"
      models:
        - alias: claude
          wire_id: claude-haiku-4-5-20251001

    # ── Bedrock (Claude via SigV4) — SECONDARY for "claude", plus a direct alias ─
    # `region` has no env-var indirection in this config shape (unlike `credential_ref`) — it
    # must match whatever AWS_REGION the SigV4 credentials in .env were minted for. Wire ids
    # match deploy/ai-gateway/gateway.config.yml's active (uncommented) lines.
    - kind: bedrock
      name: bedrock
      region: us-east-1
      models:
        - alias: claude
          wire_id: "us.anthropic.claude-sonnet-4-20250514-v1:0"
        - alias: bedrock-claude
          wire_id: "arn:aws:bedrock:us-east-1::inference-profile/us.anthropic.claude-opus-4-8"

    # ── Vertex AI (Claude on Google Cloud) — OAuth Bearer, model in the URL ─
    - kind: vertex
      name: vertex
      project: gcp-sdet-test
      region: global
      models:
        - alias: vertex-claude
          wire_id: claude-sonnet-4-6
        - alias: vertex-sonnet-4-5
          wire_id: "claude-sonnet-4-5@20250929"

    # ── Gemini (native, x-goog-api-key, model in the URL) ──────────────────
    - kind: gemini
      name: gemini
      credential_ref: "{vault://env/GEMINI_API_KEY}"
      models:
        - alias: gemini
          wire_id: gemini-2.5-flash

    # ── Azure OpenAI (deployment-addressed, Bearer + api-version) ──────────
    - kind: azure-openai
      name: azure
      # `endpoint`, like `region` above, is a literal — override by editing this file, not env.
      endpoint: "https://ai-gw-sdet-e2e-test.openai.azure.com"
      credential_ref: "{vault://env/AZURE_API_KEY}"
      api_version: "2025-01-01-preview"
      models:
        - alias: azure
          wire_id: gpt-4o-mini
          max_output_tokens: 16384

    # ── Azure AI Foundry (Claude on Azure — Anthropic Messages, x-api-key) ──
    - kind: azure-foundry
      name: azure-foundry
      endpoint: "https://claude-sonnet-4-5-eastus2.services.ai.azure.com"
      credential_ref: "{vault://env/AZURE_FOUNDRY_API_KEY}"
      models:
        - alias: azure-claude
          wire_id: claude-sonnet-4-5-foundry

    # ── Bedrock Mantle (OpenAI's own models on AWS — Responses API only) ───
    - kind: bedrock-mantle
      name: bedrock-mantle
      region: us-east-1
      credential_ref: "{vault://env/AWS_BEARER_TOKEN_BEDROCK}"
      models:
        - alias: codex                       # what Codex CLI points at
          wire_id: openai.gpt-5.6-sol
        - alias: gpt-5.6-sol
          wire_id: openai.gpt-5.6-sol
        - alias: gpt-5.6-terra
          wire_id: openai.gpt-5.6-terra
        - alias: gpt-5.6-luna
          wire_id: openai.gpt-5.6-luna

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Local, upstream-free ops endpoints — the config-driven equivalents of the
  # source system's hardcoded /health and /v1/models.
  # ─────────────────────────────────────────────────────────────────────────
  local:
    upstreams: []
    routes:
      - path: /health
        methods: [GET]
        llm_surface: health
      - path: /v1/models
        methods: [GET]
        llm_surface: models

  # ─────────────────────────────────────────────────────────────────────────
  # The LLM surfaces: one route per client protocol, fanning out to whichever
  # provider the request's model alias resolves to.
  # ─────────────────────────────────────────────────────────────────────────
  llm:
    upstreams: []
    routes:
      - path: /v1/chat/completions
        methods: [POST]
        llm_surface: openai-chat
      - path: /v1/messages
        methods: [POST]
        llm_surface: anthropic-messages
      - path: /v1/responses
        methods: [POST]
        llm_surface: openai-responses
      - path: /v1/embeddings
        methods: [POST]
        llm_surface: openai-embeddings
      - path: /v1/moderations
        methods: [POST]
        llm_surface: openai-moderation
