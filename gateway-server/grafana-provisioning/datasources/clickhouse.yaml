# Grafana auto-provisioned ClickHouse datasource, self-contained copy of
# deploy/grafana-provisioning/datasources/clickhouse.yaml (doc/0065/0066) scoped to this stack's
# own ClickHouse instance.
#
# Column mappings use the **flat** key form the grafana-clickhouse-datasource plugin expects
# directly under `traces:` and `logs:` (e.g. `timeColumn`, `traceIdColumn`). A nested `columns:`
# sub-block is **not** read by the plugin and leaves Explore showing "Missing time field" when
# rendering trace / log panels.
#
# Column names match the schema auto-created by the OTel Collector's clickhouseexporter
# (otel-collector-contrib v0.110.0).

apiVersion: 1
datasources:
  - name: ClickHouse-Traces
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      defaultDatabase: otel
      port: 9000
      server: clickhouse
      username: default
      protocol: native
      tlsSkipVerify: true

      # ── Trace view ──────────────────────────────────────────────────
      traces:
        defaultDatabase: otel
        defaultTable: otel_traces
        otelEnabled: true
        otelVersion: latest
        traceIdColumn: TraceId
        spanIdColumn: SpanId
        parentSpanIdColumn: ParentSpanId
        serviceNameColumn: ServiceName
        operationNameColumn: SpanName
        startTimeColumn: Timestamp
        durationColumn: Duration
        durationUnit: nanoseconds
        tagsColumn: SpanAttributes
        serviceTagsColumn: ResourceAttributes
        kindColumn: SpanKind
        statusCodeColumn: StatusCode
        statusMessageColumn: StatusMessage
        stateColumn: TraceState
        instrumentationLibraryNameColumn: ScopeName
        instrumentationLibraryVersionColumn: ScopeVersion
        flattenNested: false
        traceEventsColumnPrefix: Events
        traceLinksColumnPrefix: Links

      # ── Log view ───────────────────────────────────────────────────
      logs:
        defaultDatabase: otel
        defaultTable: otel_logs
        otelEnabled: true
        otelVersion: latest
        timeColumn: Timestamp
        levelColumn: SeverityText
        messageColumn: Body
        traceIdColumn: TraceId
        selectContextColumns: false

    secureJsonData:
      password: ""
