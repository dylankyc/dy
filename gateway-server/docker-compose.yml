# Gateway Server demo (doc/0188/0189/0190) — the Rust-native replacement for deploy/ai-gateway:
# same real multi-provider fan-out, built from *this* repo's own `gateway-server` binary instead
# of the external `ffc/llm-gateway` example. Also self-contained observability (doc/0190): the
# same ClickHouse/OTel-Collector/Grafana pipeline deploy/docker-compose.yaml provides, but running
# in *this* stack's own compose project so `gateway`'s spans have somewhere in-network to land
# without a second, separately-managed compose stack.
#
#   cd deploy/gateway-server
#   ./gen-secrets.sh                  # (once) materialise .env from ~/.secret and ~/.aws
#   docker compose up -d --build      # gateway (:18086), Grafana (:3000), ClickHouse, Collector
#   ./verify.sh                       # drives real provider traffic through it
#   docker compose down -v            # teardown
#
# See doc/0190 for the full trace/log-viewing guide (Grafana Explore walkthrough, ClickHouse SQL,
# which gen_ai.* attributes hold the LLM request/response bodies).
#
# There is no upstream container for `gateway` itself: the "upstreams" are the real provider APIs
# on the internet, called from the gateway container. Credentials are passed by *name*
# (gateway.config.yml references `{vault://env/VAR}`, never literals) and come from the shell env
# or ./.env (see gen-secrets.sh).
#
# The credential entries are deliberately **valueless** pass-throughs, not `VAR: ${VAR:-}`: the
# latter injects an empty string, and an empty `AWS_SESSION_TOKEN` is not the same as an absent
# one — the gateway would sign a blank `x-amz-security-token` into SigV4 and Bedrock answers 403.
# Unset stays unset; a provider with no credential is then reported as skipped by verify.sh.
#
# Port note: the observability services (4317/4318/8123/9000/3000) use the same host ports
# deploy/docker-compose.yaml's stack does — same "one stack at a time" rule deploy/README-compose.md
# already documents for the gateway port itself. Run `docker compose -f deploy/docker-compose.yaml
# down` first if that stack is up.
name: gw-gateway-server

x-gateway-env: &gateway-env
  - GATEWAY_CONFIG=/etc/gateway/config.yml
  # In-memory admin store (no Postgres container needed for this demo): unset GATEWAY_DATABASE
  # (or anything other than the literal "postgres") takes the dbless path in main.rs.
  - LOG_LEVEL=${LOG_LEVEL:-info}
  - RUST_LOG
  # `otel-collector` is this compose project's own in-network hostname (doc/0190) — not
  # `localhost`, which inside the container is the container's own loopback, not the host's.
  - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
  - OTEL_SERVICE_NAME=gateway-server
  - OPENAI_API_KEY
  - ANTHROPIC_API_KEY
  - GEMINI_API_KEY
  - AZURE_API_KEY
  - AZURE_FOUNDRY_API_KEY
  - AWS_REGION=${AWS_REGION:-us-east-1}
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - AWS_SESSION_TOKEN
  - AWS_BEARER_TOKEN_BEDROCK
  - VERTEX_ACCESS_TOKEN

services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/gateway-server/Dockerfile.gateway
    image: gw-gateway-server-gateway:local
    environment: *gateway-env
    volumes:
      - ./gateway.config.yml:/etc/gateway/config.yml:ro
    ports:
      - "18086:8000"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS localhost:8000/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ── Observability (doc/0065/0066/0190) — self-contained copy of deploy/docker-compose.yaml's
  # three-service pipeline, so this stack's spans have somewhere in-network to land without a
  # second, separately-managed compose project. ──────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
    volumes:
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - clickhouse

volumes:
  clickhouse-data:
  grafana-data:
